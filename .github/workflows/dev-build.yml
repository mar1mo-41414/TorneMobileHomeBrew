name: dev-build

# 開発版 (テスト用) ビルド。
# main への push と手動実行 (workflow_dispatch) で走り、成果物は Actions の
# artifact に加えて、ローリングな prerelease (タグ dev) にも載せる。
# 利用者は Actions 画面を開かずに Releases の「開発版 (dev)」から取得できる。
# 資産名は TorneMobileHomeBrew-dev.apk / TorneMobileHomeBrew-dev.ipa で固定し、
# リリースは作り直さず資産の差し替えで更新する (ダウンロード URL が変わらない)。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      short: ${{ steps.ver.outputs.short }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: バージョン取得
        id: ver
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/^version: *//')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "short=${VERSION%%+*}" >> "${GITHUB_OUTPUT}"
          echo "build=${VERSION##*+}" >> "${GITHUB_OUTPUT}"

      # 署名: Secrets (TMHB_KEYSTORE_BASE64 ほか) が登録されていれば
      # 配布用キーストアで署名し、なければ build.gradle.kts 側の仕組みで
      # デバッグ鍵にフォールバックする (ビルド自体は常に通る)。
      - name: 署名鍵の準備
        env:
          TMHB_KEYSTORE_BASE64: ${{ secrets.TMHB_KEYSTORE_BASE64 }}
          TMHB_STORE_PASSWORD: ${{ secrets.TMHB_STORE_PASSWORD }}
          TMHB_KEY_ALIAS: ${{ secrets.TMHB_KEY_ALIAS }}
          TMHB_KEY_PASSWORD: ${{ secrets.TMHB_KEY_PASSWORD }}
        run: |
          if [ -n "${TMHB_KEYSTORE_BASE64}" ]; then
            mkdir -p "${RUNNER_TEMP}/tmhb-signing"
            echo "${TMHB_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/tmhb-signing/release.keystore"
            {
              echo "storeFile=${RUNNER_TEMP}/tmhb-signing/release.keystore"
              echo "storePassword=${TMHB_STORE_PASSWORD}"
              echo "keyAlias=${TMHB_KEY_ALIAS}"
              echo "keyPassword=${TMHB_KEY_PASSWORD}"
            } > "${RUNNER_TEMP}/tmhb-signing/key.properties"
            echo "TMHB_KEY_PROPERTIES=${RUNNER_TEMP}/tmhb-signing/key.properties" >> "${GITHUB_ENV}"
            echo "配布用キーストアで署名します。"
          else
            echo "署名用 Secrets が未登録のため、デバッグ鍵で署名します。"
          fi

      - name: APK ビルド
        run: |
          flutter pub get
          flutter build apk --release

      - name: 成果物の配置
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/TorneMobileHomeBrew-dev.apk"

      - name: artifact アップロード
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (署名なし)
    runs-on: macos-latest
    outputs:
      short: ${{ steps.ver.outputs.short }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: バージョン取得
        id: ver
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/^version: *//')"
          echo "short=${VERSION%%+*}" >> "${GITHUB_OUTPUT}"
          echo "build=${VERSION##*+}" >> "${GITHUB_OUTPUT}"

      - name: IPA ビルド (署名なし)
        run: |
          flutter pub get
          flutter build ios --no-codesign --release

      - name: IPA のパッケージング
        run: |
          mkdir -p dist Payload
          APP_PATH="$(ls -d build/ios/iphoneos/*.app | head -n 1)"
          echo "app: ${APP_PATH}"
          cp -r "${APP_PATH}" Payload/
          zip -qry "dist/TorneMobileHomeBrew-dev.ipa" Payload

      - name: artifact アップロード
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  prerelease:
    name: ローリング prerelease (dev)
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: 成果物のダウンロード
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: prerelease の更新
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          {
            echo "開発版 (テスト用) の自動ビルドです。正式リリースではありません。"
            echo ""
            echo "- バージョン: ${VERSION}"
            echo "- 元 commit: ${SHORT_SHA}"
            echo "- Android: APK (署名は、配布用キーストアが登録されていれば配布用鍵、なければデバッグ鍵)"
            echo "- iOS: 署名なし IPA (LiveContainer 等での利用を想定)"
            echo "- デスクトップ: Linux / Windows / macOS は CI では作らず、担当が tool/dev_desktop_builds.md の手順でビルドして差し替える (macOS は署名の都合で Mac 上のビルド + 本人署名が正規経路)"
            echo ""
            echo "このリリース (タグ dev) はビルドのたびに最新の成果物へ差し替わります。"
          } > notes.md
          # リリースは作り直さない。なければ作り、あれば資産の差し替えで更新する
          # (作り直すとダウンロード URL が一時的に 404 になるため)。
          if ! gh release view dev > /dev/null 2>&1; then
            gh release create dev \
              --prerelease \
              --title "開発版 (dev)" \
              --notes-file notes.md \
              --target "${GITHUB_SHA}"
          fi
          # 今回の成果物と名前が一致しない資産 (旧名のもの) が残っていれば消す。
          gh release view dev --json assets --jq '.assets[].name' \
            | while IFS= read -r name; do
                keep=0
                for f in dist/*; do
                  if [ "$(basename "${f}")" = "${name}" ]; then
                    keep=1
                  fi
                done
                # デスクトップ版の dev 資産は CI では作らず、担当が
                # tool/dev_desktop_builds.md の手順で差し替える。
                # ここの資産整理で消さないよう保持リストに入れる。
                case "${name}" in
                  TorneMobileHomeBrew-dev-linux.tar.gz|TorneMobileHomeBrew-dev-windows.zip|TorneMobileHomeBrew-dev-macos.zip)
                    keep=1
                    ;;
                esac
                if [ "${keep}" -eq 0 ]; then
                  echo "今回の成果物に含まれない資産を削除します: ${name}"
                  gh release delete-asset dev "${name}" --yes
                fi
              done
          gh release upload dev dist/* --clobber
          gh release edit dev \
            --prerelease \
            --title "開発版 (dev)" \
            --notes-file notes.md
